<!doctype html>
<html lang="ku" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grillizza • Admin</title>
<style>
body{margin:0;background:#090909;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:16px}
.top{background:#111;border:1px solid #805c1e;border-radius:18px;padding:14px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:55px;height:55px;border-radius:50%;object-fit:cover}
h1{margin:0}.gold{color:#d8a83d}.note,.status{padding:10px;border-radius:12px;margin:10px 0;background:#18130b;border:1px solid #6d4a16}
button{border:1px solid #9d772d;background:#151515;color:#fff;padding:10px 14px;border-radius:12px;font-weight:700}
.primary{background:#a91424}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.active{background:#d51c30}
.search{width:100%;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #555;border-radius:12px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#121212;border:1px solid #6e501b;border-radius:18px;padding:12px}
.preview{height:150px;border-radius:13px;overflow:hidden;background:#201010;margin-bottom:10px}.preview img{width:100%;height:100%;object-fit:cover}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}
input{box-sizing:border-box;width:100%;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:10px;padding:9px}
@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div class="brand"><img src="IMG_0837(2).jpeg"><div><h1>Grillizza Admin</h1><div class="gold">دەستکاری ناو • نرخ • وێنە</div></div></div>
<div class="note">ناوی خواردن، نرخ و وێنە بگۆڕە، پاشان <b>Export Menu</b> بکە.</div>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="primary" onclick="exportMenu()">⬇ Export Menu</button>
<button onclick="saveDraft()">💾 Save Draft</button>
<button onclick="resetDraft()">↺ Reset</button>
</div>
<div class="tabs" id="tabs"></div>
<input class="search" id="search" placeholder="گەڕان..." oninput="render()">
<div class="status" id="status">ئامادەیە.</div>
</div>
<div class="grid" id="grid"></div>
</div>
<script>
const cats=["pizza","burgers","finger","drinks","sauces"];
const names={pizza:"پیتزا",burgers:"بەرگر",finger:"فینگەرفود",drinks:"خواردنەوە",sauces:"سۆسەکان"};
const imagePaths={
pizza:["pizza-1.jpg","pizza-2.jpg","pizza-3.jpg","pizza-4.jpg","pizza-5.jpg","pizza-6.jpg","pizza-7.jpg","pizza-8.jpg","pizza-9.jpg","pizza-10.jpg","pizza-11.jpg","pizza-12.jpg"],
burgers:["burgers-1.jpg","burgers-2.jpg","burgers-3.jpg","burgers-4.jpg","burgers-5.jpg","burgers-6.jpg","burgers-7.jpg","burgers-8.jpg"],
finger:["finger-1.jpg","finger-2.jpg","finger-3.jpg","finger-4.jpg","finger-5.jpg","finger-6.jpg","finger-7.jpg"],
drinks:["drinks-1.jpg","drinks-2.jpg","drinks-3.jpg","drinks-4.jpg","drinks-5.jpg","drinks-6.jpg","drinks-7.jpg","drinks-8.jpg","drinks-9.jpg"],
sauces:["sauces-1.jpg","sauces-2.jpg","sauces-3.jpg","sauces-4.jpg","sauces-5.jpg","sauces-6.jpg","sauces-7.jpg"]};
const data={
pizza:[
["پیزای دەریایی","بيتزا بحرية","Seafood Pizza","پیتزا دریایی","13,000"],["پیزای GFC","بيتزا GFC","GFC Pizza","پیتزا GFC","12,500"],["پیزای کالزۆنی","بيتزا كالزوني","Calzone Pizza","پیتزا کالزونه","11,250"],["پیزای گۆشت - G","بيتزا اللحم - G","G - Meat Pizza","پیتزا گوشت G","11,750"],["پیزای گۆشت کەس","بيتزا لحم خاص","Meat Gas Pizza","پیتزا گوشت ویژه","9,750"],["پیزای مەشکەل","بيتزا مشكلة","Mix Pizza","پیتزا مخلوط","9,750"],["پیزای مریشک","بيتزا دجاج","Chicken Pizza","پیتزا مرغ","9,250"],["پیزای پێپەرۆنی","بيتزا بيبروني","Pepperoni Pizza","پیتزا پپرونی","9,000"],["پیزای سەلامی","بيتزا سلامي","Salami Pizza","پیتزا سالامی","8,500"],["پیزای تونا","بيتزا تونة","Tuna Pizza","پیتزا تن ماهی","8,500"],["پیزای سەوزەوات","بيتزا خضروات","Vegetable Pizza","پیتزا سبزیجات","8,000"],["پیزای مارگەریتا","بيتزا مارغريتا","Margherita Pizza","پیتزا مارگاریتا","7,250"]],
burgers:[
["بەرگری سادە","برغر عادي","Simple Burger","برگر ساده","5,250"],["چیز بەرگر","تشيز برغر","Cheese Burger","چیز برگر","5,750"],["ناوسێری بەرگر","برغر خاص","Ns weri Burger","برگر مخصوص","6,250"],["دەمبل بەرگر","دبل برغر","Double Burger","دبل برگر","7,250"],["بەرگری کوارەک","برغر مشروم","Mushroom Burger","برگر قارچ","6,500"],["بۆمب بەرگر","بومب برغر","Bomb Burger","بمب برگر","6,000"],["مێگزە مین بەرگر","برغر مميز","Megza Main Burger","برگر مگزا مین","8,000"],["مریشکی کریسپی","دجاج كريسبي","Chicken Crispy","مرغ کریسپی","6,000"]],
finger:[
["گریزۆ","غريزو","Grizo","گریزو","7,000"],["باڵ (٥ پارچە)","أجنحة (5 قطع)","Wings (5 Pieces)","بال (۵ تکه)","5,000"],["فینگەری G","فينغر G","G-Finger","فینگر G","6,250"],["فینگەری سۆس","صوص فينغر","Finger Sauce","سس فینگر","4,000"],["فینگر","فينغر","Finger","فینگر","1,500"],["چیز توویستەر","تشيز تويستر","Cheese Twister","چیز تویستر","4,750"],["توویستەری سادە","تويستر عادي","Simple Twister","تویستر ساده","4,250"]],
drinks:[
["کۆلای قوطی","كولا علبة","Cola Can","نوشابه قوطی","500"],["کۆلای فریش","كولا فريش","Cola Fresh","نوشابه لیوانی","1,000"],["کۆلای زیرو","كولا زيرو","Zero Cola","نوشابه زیرو","500"],["فانتای قوطی","فانتا علبة","Fanta Can","فانتا قوطی","500"],["فانتای فریش","فانتا فريش","Fanta Fresh","فانتا لیوانی","1,000"],["سپڕایتی قوطی","سبرايت علبة","Sprite Can","اسپرایت قوطی","500"],["سپڕایتی فریش","سبرايت فريش","Sprite Fresh","اسپرایت لیوانی","1,000"],["سپڕایت لیمۆ و نعناع","سبرايت ليمون ونعناع","Sprite Lemon & Mint","اسپرایت لیمو و نعناع","500"],["ئاو","ماء","Water","آب","250"]],
sauces:[
["سۆسی F1","صلصة F1","F1 Sauce","سس F1","1,000"],["سۆسی B1","صلصة B1","B1 Sauce","سس B1","1,000"],["سۆسی پەنیر","صلصة الجبنة","Cheese Sauce","سس پنیر","1,000"],["سۆسی گریللیزا","صلصة غريلليزا","Grillizza Sauce","سس گریللیزا","1,000"],["سۆسی هەنی ماستەرد","صلصة هاني ماسترد","Honey Mustard Sauce","سس هانی ماسترد","1,000"],["سۆسی ڕانچ","صلصة رانش","Ranch Sauce","سس رنچ","1,000"],["سۆسی تیز","صلصة حارة","Spicy Sauce","سس تند","1,000"]]};
let db=JSON.parse(localStorage.getItem("grillizza-admin-draft")||"null")||{menu:data};
let active="pizza",uploads={};

function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function status(x){document.getElementById("status").textContent=x}
function saveDraft(){localStorage.setItem("grillizza-admin-draft",JSON.stringify(db));status("Draft هەڵگیرا ✅")}
function resetDraft(){if(confirm("گەڕاندنەوە بۆ سەرەتا؟")){localStorage.removeItem("grillizza-admin-draft");db={menu:JSON.parse(JSON.stringify(data))};render()}}
function upd(i,k,v){db.menu[active][i][k]=v}
function pickImage(key,input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{uploads[key]=r.result;document.getElementById("img-"+key).src=r.result;status("وێنە گۆڕدرا. Export بکە.")};r.readAsDataURL(f)}
function render(){
document.getElementById("tabs").innerHTML=cats.map(c=>`<button class="${active===c?"active":""}" onclick="active='${c}';render()">${names[c]} (${db.menu[c].length})</button>`).join("");
let q=document.getElementById("search").value.trim().toLowerCase();
document.getElementById("grid").innerHTML=db.menu[active].map((it,i)=>{
let key=active+"-"+i;if(q&&!it.some(x=>String(x).toLowerCase().includes(q)))return "";
return `<article class="card"><b class="gold">#${i+1} — ${names[active]}</b>
<div class="preview"><img id="img-${key}" src="${uploads[key]||imagePaths[active][i]}"></div>
<div class="fields">
<div class="field"><label>کوردی</label><input value="${esc(it[0])}" oninput="upd(${i},0,this.value)"></div>
<div class="field"><label>عربي</label><input value="${esc(it[1])}" oninput="upd(${i},1,this.value)"></div>
<div class="field"><label>English</label><input value="${esc(it[2])}" oninput="upd(${i},2,this.value)"></div>
<div class="field"><label>فارسی</label><input value="${esc(it[3])}" oninput="upd(${i},3,this.value)"></div>
<div class="field full"><label>نرخ (د.ع)</label><input value="${esc(it[4])}" oninput="upd(${i},4,this.value)"></div>
<div class="field full"><label>گۆڕینی وێنە</label><input type="file" accept="image/*" onchange="pickImage('${key}',this)"></div>
</div></article>`}).join("");
}
function download(name,text,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function exportMenu(){
saveDraft();
let payload={...db,uploads};
let code=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grillizza Menu Updated</title></head><body><h1>Grillizza</h1><p>Use the current menu data from the Admin panel.</p><script>const grillizzaMenu=${JSON.stringify(payload)};<\/script></body></html>`;
download("Grillizza_MENU_UPDATED.html",code,"text/html;charset=utf-8");
status("Export کرا ✅");
}
render();
</script>
</body>
</html>
