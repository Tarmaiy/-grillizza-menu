function setStatus(x){document.getElementById('status').textContent=x}
function render(){
 document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="btn tab ${active===c?'active':''}" onclick="active='${c}';render()">${names[c]} (${db.menu[c].length})</button>`).join('');

 document.getElementById('grid').innerHTML=arr.map((it,i)=>{
   const key=active+'-'+i, path=uploads[key]||imagePaths[active][i];
   if(q && !it.some(x=>String(x).toLowerCase().includes(q))) return '';
   return `<article class="card"><div class="head"><span class="num">#${i+1}</span><b>${names[active]}</b></div><div class="preview"><img id="img-${key}" src="${path}" onerror="this.style.opacity=.25"></div><div class="fields">

function upd(i,k,v){db.menu[active][i][k]=v}
function pickImage(key,input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{uploads[key]=r.result;document.getElementById('img-'+key).src=r.result;setStatus('وێنەکە گۆڕدرا. بۆ هەڵگرتنی کۆتایی Export بکە.')};r.readAsDataURL(f)}
function showJson(){document.getElementById('jsonbox').value=JSON.stringify(db,null,2);document.getElementById('modal').classList.add('open')}
function closeJson(){document.getElementById('modal').classList.remove('open')}
function downloadJson(){download('menu.json',JSON.stringify(db,null,2),'application/json')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function toDataURL(src){if(src.startsWith('data:'))return src;const r=await fetch(src);const b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}

 for(const c of cats){imgs[c]=[];for(let i=0;i<db.menu[c].length;i++){const key=c+'-'+i;imgs[c][i]=uploads[key]||await toDataURL(imagePaths[c][i]);}}

}
