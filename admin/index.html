.field{

.field label{

function esc(v){

return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;");

}


/* =========================

========================= */

/* =========================
   IMAGE UPLOAD
========================= */

function pickImage(key,input){

const f=input.files[0];

if(!f)return;


const reader=new FileReader();


reader.onload=()=>{

uploads[key]=reader.result;


const img=
document.getElementById(
"img-"+key
);


if(img){

img.src=reader.result;

}


setStatus(
"وێنەکە گۆڕدرا. Export بکە بۆ هەڵگرتنی کۆتایی."
);

};


reader.readAsDataURL(f);

}

/* =========================
   DOWNLOAD
========================= */

function download(name,text,type){

const a=
document.createElement("a");

a.href=
URL.createObjectURL(
new Blob([text],{type:type})
);

a.download=name;

a.click();

setTimeout(
()=>{
URL.revokeObjectURL(a.href);
},
500
);

}


/* =========================
   IMAGE → DATA URL
========================= */

async function toDataURL(src){

if(
src.startsWith("data:")
){
return src;
}


const response=
await fetch(src);


const blob=
await response.blob();


return await new Promise(
resolve=>{

const reader=
new FileReader();

reader.onload=()=>{
resolve(reader.result);
};

reader.readAsDataURL(blob);

});

}
